
clusters:
  # ================= 本地主集群 (位于你的 Windows 电脑 172.200.0.125) =================
  - name: "WSL-Kind"
    # 🌟 修改点：使用 Windows 的局域网物理 IP。
    # 假设你之前在 Kind 中通过 NodePort 暴露了 Prometheus，端口为 30090
    prometheus_url: "http://172.200.0.125:30090/api/v1/query"
    region: "cn-east"

  # ================= 局域网边缘集群 (另一台远程设备) =================
  - name: "Jetson-K3s"
    # 这个保持不变，因为它已经是物理 IP 访问了
    prometheus_url: "http://172.200.4.253:30090/api/v1/query"
    region: "cn-south"

